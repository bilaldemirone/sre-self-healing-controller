apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-controller
subjects:
  - kind: ServiceAccount
    name: sre-controller
    namespace: default
roleRef:
  kind: ClusterRole
  name: sre-controller
  apiGroup: rbac.authorization.k8s.io